# VM100 common peer lifecycle foundation, WireGuard-first.
PEER_LIFECYCLE_SCHEMA=router-wgpay-peer-lifecycle-config-v1
PEER_STATE_DIR=/etc/router-wgpay-peer-state
PEER_REGISTRY_FILE=/etc/router-wgpay-peer-state/registry.tsv
PEER_ACTIVE_SELECTOR_FILE=/etc/router-wgpay-peer-state/peers.conf
