# VM100 declarative slot-topology receiver contract.
TOPOLOGY_SCHEMA=router-wgpay-slot-topology-v1
TOPOLOGY_ACK_SCHEMA=router-wgpay-slot-topology-ack-v1
TOPOLOGY_STATE_SCHEMA=router-wgpay-slot-topology-state-v2
TOPOLOGY_PLAN_SCHEMA=router-wgpay-slot-topology-plan-v2
TOPOLOGY_INPUT_MAX_BYTES=4096
TOPOLOGY_CANONICAL_SLOTS=egress1,egress2,egress3,egress4,egress5
TOPOLOGY_CANONICAL_SELECTORS=cs1,cs2,cs3,cs4,cs5
TOPOLOGY_SLOT_egress1_SELECTOR=cs4
TOPOLOGY_SLOT_egress1_TARGET=canary_vpn1
TOPOLOGY_SLOT_egress2_SELECTOR=cs5
TOPOLOGY_SLOT_egress2_TARGET=canary_vpn2
TOPOLOGY_SLOT_egress3_SELECTOR=cs1
TOPOLOGY_SLOT_egress3_TARGET=canary_vpn3
TOPOLOGY_SLOT_egress4_SELECTOR=cs2
TOPOLOGY_SLOT_egress4_TARGET=canary_vpn4
TOPOLOGY_SLOT_egress5_SELECTOR=cs3
TOPOLOGY_SLOT_egress5_TARGET=canary_vpn5

# Shared VM100 selector transaction contract.
TOPOLOGY_SELECTOR_FILE="${TOPOLOGY_SELECTOR_FILE:-/etc/router-wgpay-selector.d/peers.conf}"
TOPOLOGY_SELECTOR_APPLY="${TOPOLOGY_SELECTOR_APPLY:-/usr/local/sbin/router-wgpay-canary-apply.sh}"
TOPOLOGY_SELECTOR_TABLE="${TOPOLOGY_SELECTOR_TABLE:-wgpay_dscp_canary}"
TOPOLOGY_STATE_DIR="${TOPOLOGY_STATE_DIR:-/var/lib/router-wgpay-topology}"
TOPOLOGY_LOCK_FILE="${TOPOLOGY_LOCK_FILE:-/var/run/router-wgpay-selector.lock}"
